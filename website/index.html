<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FieldSimulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">FieldSimulator</a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="download.html">Download</a></li>
        <li><a href="docs.html">Docs</a></li>
        <li><a href="https://github.com/thecheetoman/FieldSim" target="_blank">GitHub</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="hero" id="heroCarousel">
      <h1>FieldSimulator</h1>
      <p>A free, open source FRC game</p>
      <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="download.html" class="btn btn-download">Get the Game</a>
        <a href="docs.html" class="btn btn-primary">Documentation for adding custom robots</a>
      </div>
    </section>
  </main>
<script>
const images = [
  './assets/screenshot1.png',
  './assets/screenshot2.png',
  './assets/screenshot3.png'
];

let currentIndex = 0;
const heroElement = document.getElementById('heroCarousel');

function updateBackground() {
  heroElement.style.backgroundImage = `url('${images[currentIndex]}')`;
  currentIndex = (currentIndex + 1) % images.length;
}

// Set initial background
updateBackground();

// Change image every 10,000 ms (10 seconds)
setInterval(updateBackground, 10000);
</script>
</body>
</html>
